<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Práctica 1 - Líneas y colores</title>
  <!-- Cargamos la biblioteca p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
  <!-- A partir de aquí escribimos nuestro programa -->
  <script>
    function setup() {
      createCanvas(400, 400);
      background(255);


      // Lado superior: rojo opaco, grosor 3.
      stroke(255, 0, 0);
      strokeWeight(10);
      line(50, 80, 300, 80);


      // Lado derecho: verde semitransparente, grosor 6.
      stroke(0, 255, 0, 255);
      strokeWeight(6);
      line(300, 300, 300, 80);


      // Lado inferior: azul opaco, grosor 2.
      stroke(0, 0, 255);
      strokeWeight(2);
      line(50, 300, 300, 300);


      // Lado izquierdo: gris, grosor 4.
      stroke(120,100);
      strokeWeight(4);
      line(50, 80, 50, 300);
    }
  </script>
</body>
</html>
