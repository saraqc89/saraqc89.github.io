<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Práctica 3 - Casa con P5.js</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<script>
function setup() {
  createCanvas(400, 400);
  background(200);

  // 2. Suelo (césped)
  noStroke();
  fill(80, 160, 80);
  rect(0, 320, 400, 80);

  // 3. Paredes
  stroke(0);
  strokeWeight(2);
  fill(179, 144, 122); 
  rect(80, 150, 240, 170);

  // 4. Triángulo del tejado
  fill(180, 50, 50); 
  triangle(70, 150, 200, 60, 330, 150);

  // 5. Puerta
  fill(139, 69, 19); 
  rect(170, 230, 60, 90);

  // 6. Ventana izquierda
  fill(139, 69, 19); 
  rect(110, 180, 50, 60);
  fill(135, 206, 235);
  rect(115, 185, 40, 50);
  stroke(139, 69, 19);
  strokeWeight(2);
  line(135, 185, 135, 235); 
  line(115, 210, 155, 210); 

  // 7. Ventana derecha
  fill(139, 69, 19); 
  rect(240, 180, 50, 60);
  fill(135, 206, 235); 
  rect(245, 185, 40, 50);
  stroke(139, 69, 19);
  strokeWeight(2);
  line(265, 185, 265, 235); 
  line(245, 210, 285, 210); 
}
</script>
</body>
</html>
